---
- name: List installed uv tools
  ansible.builtin.command:
    argv: ["{{ homebrew_path }}/uv", tool, list]
  register: python_uv_installed
  changed_when: false
  check_mode: false
  when: python_uv_tools | length > 0

- name: Install missing uv tools
  ansible.builtin.command:
    argv: ["{{ homebrew_path }}/uv", tool, install, "{{ item }}"]
  loop: "{{ python_uv_tools }}"
  changed_when: true
  when: python_uv_installed.stdout is not search('(?m)^' ~ (item | regex_escape) ~ ' ')
